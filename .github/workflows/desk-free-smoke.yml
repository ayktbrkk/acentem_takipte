name: Desk-Free Smoke

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional base URL override (defaults to repository variable E2E_BASE_URL)"
        required: false
        type: string
      profile:
        description: "Test profile to run"
        required: false
        default: "f4-smoke"
        type: choice
        options:
          - f4-smoke
          - all-e2e
          - platform
      grep:
        description: "Playwright grep pattern"
        required: false
        default: "F4 desk-free core flows"
        type: string
      workers:
        description: "Playwright worker count"
        required: false
        default: "1"
        type: string
      trace_mode:
        description: "Playwright trace mode"
        required: false
        default: "retain-on-failure"
        type: choice
        options:
          - retain-on-failure
          - on
          - off
      target_label:
        description: "Environment label shown in job summary"
        required: false
        default: "manual"
        type: string
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: desk-free-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Decide whether smoke tests should run
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ -n "${BASE_URL:-}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Desk-free smoke tests are enabled for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "E2E_BASE_URL is not configured; scheduled desk-free smoke tests were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  playwright-smoke:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_TRACE_MODE: ${{ inputs.trace_mode || 'retain-on-failure' }}
      E2E_WORKERS: ${{ inputs.workers || '1' }}
      E2E_TARGET_LABEL: ${{ inputs.target_label || 'nightly' }}
      E2E_PROFILE: ${{ inputs.profile || 'f4-smoke' }}
      PLAYWRIGHT_JSON_OUTPUT_DIR: test-results
      PLAYWRIGHT_JSON_OUTPUT_NAME: smoke-report.json
      PLAYWRIGHT_JUNIT_OUTPUT_DIR: test-results
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: smoke-junit.xml
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Validate smoke test configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${E2E_BASE_URL:-}" ]; then
            echo "E2E_BASE_URL is required (repository variable or workflow input)." >&2
            exit 1
          fi
          if [ -z "${E2E_USER:-}" ] || [ -z "${E2E_PASSWORD:-}" ]; then
            echo "E2E_USER and E2E_PASSWORD secrets are required for authenticated smoke tests." >&2
            exit 1
          fi
          if ! [[ "${E2E_WORKERS}" =~ ^[0-9]+$ ]]; then
            echo "workers input must be numeric." >&2
            exit 1
          fi

      - name: Run platform smoke tests (data-independent)
        id: platform_smoke
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_DIR: smoke-output/platform
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
          PLAYWRIGHT_JUNIT_OUTPUT_DIR: smoke-output/platform
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit.xml
        run: |
          set -euo pipefail
          npm run e2e:smoke:ci -- --workers "${E2E_WORKERS}"

      - name: Run business smoke tests (data-dependent)
        id: business_smoke
        if: ${{ inputs.profile != 'platform' }}
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_DIR: smoke-output/business
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
          PLAYWRIGHT_JUNIT_OUTPUT_DIR: smoke-output/business
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit.xml
        run: |
          set +e
          if [ "${E2E_PROFILE}" = "all-e2e" ]; then
            npm run e2e:ci -- --workers "${E2E_WORKERS}" --grep-invert "Acentem Takipte smoke"
          else
            npm run e2e:f4:ci -- --grep "${{ inputs.grep || 'F4 desk-free core flows' }}" --workers "${E2E_WORKERS}"
          fi
          BUSINESS_EXIT=$?
          set -e
          echo "business_exit=${BUSINESS_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Classify smoke coverage
        id: classify
        if: always()
        shell: bash
        env:
          BUSINESS_EXIT: ${{ steps.business_smoke.outputs.business_exit }}
        run: |
          set +e
          OUTPUT=$(node scripts/e2e/classify-smoke-coverage.mjs \
            smoke-output/platform/report.json \
            smoke-output/business/report.json \
            "${BUSINESS_EXIT:-0}" \
            "${E2E_PROFILE}")
          CLASSIFY_EXIT=$?
          set -e
          printf '%s\n' "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          OVERALL=$(printf '%s\n' "$OUTPUT" | sed -n 's/^- overall_smoke: //p')
          echo "overall_smoke=${OVERALL}" >> "$GITHUB_OUTPUT"
          exit "${CLASSIFY_EXIT}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/smoke-output
          if-no-files-found: ignore

      - name: Append Playwright parsed summary
        if: always()
        shell: bash
        run: |
          node scripts/e2e/print-playwright-summary.mjs smoke-output/business/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Optional webhook notification (Slack-compatible)
        if: always()
        shell: bash
        env:
          SMOKE_WEBHOOK_URL: ${{ secrets.SMOKE_WEBHOOK_URL }}
          OVERALL_SMOKE: ${{ steps.classify.outputs.overall_smoke }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_WEBHOOK_URL:-}" ]; then
            echo "SMOKE_WEBHOOK_URL is not configured; skipping webhook notification."
            exit 0
          fi
          STATUS="${{ job.status }}"
          MSG="Desk-Free ${E2E_PROFILE} smoke run: ${STATUS}\nOverall: ${OVERALL_SMOKE:-unknown}\nTarget: ${E2E_TARGET_LABEL}\nBase URL: ${E2E_BASE_URL}\nRun: ${RUN_URL}"
          jq -n --arg text "$MSG" '{text:$text}' > /tmp/smoke-webhook.json
          curl -fsS -X POST -H "Content-Type: application/json" --data @/tmp/smoke-webhook.json "$SMOKE_WEBHOOK_URL"

      - name: Job summary
        if: always()
        shell: bash
        env:
          SMOKE_WEBHOOK_URL: ${{ secrets.SMOKE_WEBHOOK_URL }}
          OVERALL_SMOKE: ${{ steps.classify.outputs.overall_smoke }}
        run: |
          if [ -n "${SMOKE_WEBHOOK_URL:-}" ]; then
            WEBHOOK_STATUS="enabled"
          else
            WEBHOOK_STATUS="disabled"
          fi
          {
            echo "## Desk-Free Smoke Run"
            echo ""
            echo "- Target: \`${E2E_TARGET_LABEL}\`"
            echo "- Profile: \`${E2E_PROFILE}\`"
            echo "- Overall: \`${OVERALL_SMOKE:-n/a}\`"
            echo "- Base URL: \`${E2E_BASE_URL}\`"
            echo "- Grep: \`${{ inputs.grep || 'F4 desk-free core flows' }}\`"
            echo "- Workers: \`${E2E_WORKERS}\`"
            echo "- Trace mode: \`${E2E_TRACE_MODE}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- JUnit: \`smoke-output/business/junit.xml\`"
            echo "- JSON: \`smoke-output/business/report.json\`"
            echo "- Webhook: \`${WEBHOOK_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or comment failure issue (dedupe)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          SMOKE_PROFILE: ${{ env.E2E_PROFILE }}
          SMOKE_TARGET: ${{ env.E2E_TARGET_LABEL }}
          SMOKE_BASE_URL: ${{ env.E2E_BASE_URL }}
          SMOKE_GREP: ${{ inputs.grep || 'F4 desk-free core flows' }}
          SMOKE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_WORKFLOW: ${{ github.workflow }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const profile = process.env.SMOKE_PROFILE || "f4-smoke";
            const target = process.env.SMOKE_TARGET || "nightly";
            const baseUrl = process.env.SMOKE_BASE_URL || "";
            const grep = process.env.SMOKE_GREP || "";
            const runUrl = process.env.SMOKE_RUN_URL;
            const workflowName = process.env.SMOKE_WORKFLOW || "Desk-Free Smoke";
            const title = `[Desk-Free Smoke][${target}][${profile}] Failure`;
            const marker = `<!-- desk-free-smoke:${target}:${profile} -->`;

            const listResp = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = listResp.data.find(
              (issue) =>
                !issue.pull_request &&
                issue.title === title
            );

            const bodyLines = [
              marker,
              `Workflow failure detected for \`${workflowName}\`.`,
              "",
              `- Target: \`${target}\``,
              `- Profile: \`${profile}\``,
              `- Base URL: \`${baseUrl}\``,
              `- Grep: \`${grep}\``,
              `- Branch/Ref: \`${context.ref}\``,
              `- Commit: \`${context.sha}\``,
              `- Run: ${runUrl}`,
            ];

            const commentBody = [
              "New failure detected.",
              "",
              `- Time: ${new Date().toISOString()}`,
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: commentBody,
              });
              core.info(`Commented on existing issue #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: bodyLines.join("\n"),
              labels: ["bug"],
            });
            core.info(`Created failure issue: ${title}`);
